name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            label: Linux
            suffix: linux
          - runner: windows-latest
            label: Windows
            suffix: windows
          - runner: macos-latest
            label: macOS
            suffix: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve release version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH (example: v0.3.0)."
            exit 1
          fi
          version="${tag#v}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Release version: ${version}"

      - name: Align pom.xml version with tag
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="${{ env.RELEASE_VERSION }}" -DgenerateBackupPoms=false

      - name: Verify pom.xml version matches tag
        shell: bash
        run: |
          pom_version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "${pom_version}" != "${RELEASE_VERSION}" ]; then
            echo "pom.xml version (${pom_version}) does not match tag version (${RELEASE_VERSION})."
            exit 1
          fi
          echo "pom.xml version matches tag: ${pom_version}"

      - name: Build distribution
        run: mvn -B clean package -Ppackage-dist -DskipTests

      - name: Rename artifacts with OS suffix
        shell: pwsh
        run: |
          $suffix = "${{ matrix.platform.suffix }}"
          Move-Item "target/code-atlas-bin.zip" "target/code-atlas-bin-$suffix.zip" -Force
          Move-Item "target/code-atlas-update.zip" "target/code-atlas-update-$suffix.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform.suffix }}
          path: |
            target/code-atlas-bin-${{ matrix.platform.suffix }}.zip
            target/code-atlas-update-${{ matrix.platform.suffix }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Failing by policy."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( -name "code-atlas-bin-*.zip" -o -name "code-atlas-update-*.zip" \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          release_args=(
            --repo "${GITHUB_REPOSITORY}"
            --title "${GITHUB_REF_NAME}"
            --latest
          )

          if [ -n "$(printf '%s' "$tag_message" | tr -d '[:space:]')" ]; then
            auto_notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body)"
            notes_file="$(mktemp)"
            {
              printf '%s\n\n' "$tag_message"
              printf '%s\n' "$auto_notes"
            } > "$notes_file"
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi

          gh release create "${GITHUB_REF_NAME}" "${files[@]}" "${release_args[@]}"

  sync-pom-version:
    name: Sync pom version on main
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve release version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Release version: ${version}"

      - name: Align pom.xml version with tag
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="${{ env.RELEASE_VERSION }}" -DgenerateBackupPoms=false

      - name: Commit pom version on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --staged --quiet; then
            echo "pom.xml on main already matches release version ${RELEASE_VERSION}."
            exit 0
          fi
          git commit -m "chore: bump pom version to ${RELEASE_VERSION}"
          git push
