spring.application.name=code-atlas

server.port=8088

spring.datasource.url=jdbc:sqlite:${atlas.data.dir:data}/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:sqlite:${atlas.data.dir:data}/app.db

codeatlas.gemini.timeout-seconds=300

codeatlas.context.index-max-age-minutes=30
codeatlas.context.max-total-chars=7000
codeatlas.context.max-files=6
codeatlas.context.max-snippet-lines=20
codeatlas.context.max-snippet-chars=1200
codeatlas.context.indexed.max-files=16
codeatlas.context.indexed.max-graph-depth=3
codeatlas.context.indexed.max-total-chars=7000
codeatlas.context.offline-summary.max-files-per-chunk=5
codeatlas.context.offline-summary.max-tokens-per-file=2000
codeatlas.context.offline-summary.prompt-budget-ratio=0.8
