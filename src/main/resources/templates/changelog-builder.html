<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Atlas - Changelog Builder</title>
    <th:block th:replace="~{fragments/head :: pageHead('changelog-builder.css')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-3">Changelog Builder</h1>
    <p class="text-muted mb-4">Generate structured release summaries using Git commit history diffs and your favorite AI model.</p>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">1. Select Project &amp; Model</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="projectSelect" class="form-label">Project</label>
                    <select id="projectSelect" class="form-select">
                        <option value="">Select project...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="aiModelSelect" class="form-label">AI Model</label>
                    <select id="aiModelSelect" class="form-select">
                        <option value="">Select model...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="exportFormatSelect" class="form-label">Export Format</label>
                    <select id="exportFormatSelect" class="form-select">
                        <option value="MARKDOWN">Markdown</option>
                        <option value="SLACK">Slack (mrkdwn)</option>
                        <option value="JSON">JSON</option>
                        <option value="PLAIN_TEXT">Plain Text</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4 d-none" id="journalCard">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-middle">
            <span class="align-self-center">2. Journal</span>
            <div style="width: 250px;">
                <select id="branchSelect" class="form-select form-select-sm">
                    <option value="">Select branch...</option>
                </select>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle" id="commitTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input class="form-check-input" type="checkbox" id="selectAllCommits">
                            </th>
                            <th>Commit Description</th>
                            <th>Author</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="commitTableBody">
                        <tr>
                            <td colspan="4" class="text-center text-muted">Select a branch to retrieve commits.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-end mt-3">
                <button type="button" class="btn btn-success" id="generateChangelogBtn" disabled>
                    <i class="bi bi-cpu me-1"></i> Generate Changelog
                </button>
            </div>
        </div>
    </div>

    <div class="card mb-4 d-none" id="resultsCard">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <span>Generated Changelog</span>
            <button type="button" class="btn btn-light btn-sm" id="copyChangelogBtn">
                <i class="bi bi-clipboard me-1"></i> Copy Changelog
            </button>
        </div>
        <div class="card-body">
            <div id="semverBadge" class="alert alert-secondary mb-3 d-none" role="status"></div>
            <textarea class="form-control" id="changelogResultTextarea" rows="12" readonly></textarea>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/scripts :: pageScripts('changelog-builder.js')}"></th:block>
</body>
</html>
